# Translations: one ARB file per language in lib/l10n/ (app_en.arb is the
# template — every key starts there). `flutter pub get` / any build
# regenerates lib/l10n/gen/app_localizations*.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
